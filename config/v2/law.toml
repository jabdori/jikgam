# v2 엔드투엔드의 법령·고시 묶음(docs/evaluation-v2.md §4.4). 조직 A 약관은 v1 그대로 두고, 이 묶음의 구간을 함께 찾는다.
# 법령 구간은 엔진이 이미 하는 근거 판별(applies, Jev)에 같은 호출로 넣는다. 확률 0.5 이상을 근거로 고른다.
# 실행: uv run --group embed python -m jikgam.sim.runner --org org_a --law r4 ...

# 법령 구간에 묻는 판별 질문(law_applies). 두 프로필이 같은 질문을 쓴다
question_set = "data/question_sets/extra/law-v2.json"

# 개발용 오프라인 비교에서 두 프로필의 정답 근거 덮는 비율이 함께 오른 검색어 규칙.
# 조직 약관 검색은 기존 최근 3발화를 유지하고, 법령만 고객 발화 전체에 기존 의도·표현 확장을 더한다.
query_scope = "all"

[r0]
# 기준선 R0: 조 단위 + 대체 규칙(256토큰) 구간, v1 검색 규칙(상위 4개에서 참조·별표 한 단계)
mode = "r0"
chunks = "article256"
meta = "none"
max_candidates = 8

[r4]
# 새 방식 R4: (b) 구간 + 구간 정보, snowflake-ko + BM25 RRF 결합(val에서 고름, ADR 0024 보완)
# 리랭킹은 엔진의 근거 판별 호출(applies)이 한다. 근거는 확률 순으로 세운다
mode = "r4"
chunks = "b-W4000-C800-raw"
meta = "full"
embed = "snow"
fusion = "rrf"
max_candidates = 8

[r5]
# R4 + 메타데이터 거르기(docs/v2-law-final.md의 최종 구성 (m3), ADR 0029). 검색은 R4와 같다.
# 조직 설정 law_industries에 해당하는 구간만 남기고, 직전 판단의 상담 주제(law_topic, 확률 0.5 이상)가 있으면 그 주제 구간만 남긴다.
# 상위 8개 중 2자리는 거르지 않은 검색 순위로 채운다. 주제 질문은 엔진의 첫 판별 요청에 더한다(호출 수는 늘지 않는다)
mode = "r5"
chunks = "b-W4000-C800-raw"
meta = "full"
embed = "snow"
fusion = "rrf"
max_candidates = 8
labels = "data/v2/law-meta/b-W4000-C800-raw.json"
topic_question_set = "data/question_sets/extra/law-topic-v1.json"
reserved = 2
topic_threshold = 0.5

# 약관과 법령이 어긋날 때 생성 모델이 판단하지 않게 하는 결정적 검사(결정 기록 0004와 같은 원칙).
# 금액과 환불 자격은 지금처럼 업무 API 결과(견적)를 따른다(대상 견적이 없으면 환불이 된다고 말할 수 없다).
# 아래 검사는 법령 묶음을 켠 세션의 생성 결과에 더한다. 위반이면 지적을 붙여 한 번 더 생성하고, 그래도 남으면 고정 문구다.
[[guards]]
id = "withdrawal-days-floor"
# "청약철회 … N일"에서 N이 법정 기간보다 짧으면 위반이다(전자상거래법 제17조 제1항: 7일)
pattern = "청약\\s*철회[^.?!\\n]{0,40}?(\\d+)\\s*일"
min = 7
message = "청약철회 기간을 법정 기간(7일)보다 짧게 안내했다"
