# 판별 백엔드 설정. 엔진과 평가 스크립트가 이름으로 골라 쓴다.
# 가격은 USD / 1M 토큰. 확인한 날짜와 출처를 함께 적고, 바뀌면 새 값으로 고친 뒤 이전 측정의 비용은 그 측정의 meta.json을 따른다.
# 외부 모델은 버전 ID를 고정한다. 별칭(jev-latest, *-latest)은 쓰지 않는다.

[jev]
kind = "systemone"
url = "https://api.typesafe.ai/v1/systemone"
model = "jev-1.13.0"
api_key_env = "TYPESAFE_API_KEY"
price_input_per_mtok = 0.042
price_output_per_mtok = 0.0
price_source = "https://docs.typesafe.ai/models.md (2026-10-14 확인: 입력만 과금)"

[clef]
kind = "systemone"
url = "https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/cloudflare/clef"
model = "clef"
envelope = "cloudflare"
api_key_env = "CLOUDFLARE_API_TOKEN"
price_input_per_mtok = 0.24
price_output_per_mtok = 0.0
price_source = "https://developers.cloudflare.com/workers-ai/models/clef/ (2026-10-14 확인)"
note = "Workers AI 모델 ID에는 버전 고정 수단이 없다. 응답의 model 값과 측정 날짜를 기록한다."

[clef-flash]
kind = "systemone"
url = "https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/cloudflare/clef-flash"
model = "clef-flash"
envelope = "cloudflare"
api_key_env = "CLOUDFLARE_API_TOKEN"
price_input_per_mtok = 0.038
price_output_per_mtok = 0.0
price_source = "https://developers.cloudflare.com/workers-ai/models/clef-flash/ (2026-10-14 확인, 컨텍스트 24,576 토큰)"
note = "Workers AI 모델 ID에는 버전 고정 수단이 없다. 응답의 model 값과 측정 날짜를 기록한다."

[gemini-flash]
kind = "gemini"
model = "gemini-3.8-flash"
thinking_level = "low"
api_key_env = "GCP_API_KEY"
price_input_per_mtok = 0.75
price_output_per_mtok = 3.75
price_source = "https://ai.google.dev/gemini-api/docs/pricing (2026-10-14 확인: 2026-12-31까지 가격, 출력에 사고 토큰 포함)"

[gemini-pro]
kind = "gemini"
model = "gemini-3.1-pro-preview"
api_key_env = "GCP_API_KEY"
price_input_per_mtok = 2.0
price_output_per_mtok = 12.0
price_source = "https://ai.google.dev/gemini-api/docs/pricing (2026-10-14 확인: 200k 토큰 이하 프롬프트, 출력에 사고 토큰 포함)"

# 한국어 튜닝 모델(docs/training.md, ADR 0012). 이 PC(RTX 3090 Ti)의 WSL2에서 Unsloth Studio Decision API로 서빙한다.
# jikgam/train/serve.py --run <실행> --port <포트>로 띄운 뒤 쓴다. 응답의 model은 항상 "laya-local"이라,
# 어떤 가중치인지는 served와 weights_sha256_16(병합 모델의 백본 + 판별 헤드 파일 sha256 앞 16자리)으로 확인한다.
# 외부 과금이 없어 단가는 0이다. 비용은 docs/evaluation.md §2.6대로 GPU 점유 시간 × 클라우드 GPU 시간당 단가로
# jikgam/train/gpu_cost.py가 실행 원본 로그에서 따로 계산한다.
["q35-0.8b-ko"]
kind = "systemone"
url = "http://127.0.0.1:8888/v1/systemone"
model = "laya-local"
api_key_env = "UNSLOTH_API_KEY"
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
price_source = "로컬 서빙, 외부 과금 없음. 참고 비용은 docs/evaluation.md §2.6(jikgam/train/gpu_cost.py)"
served = "WSL2 ~/jikgam-train/runs/q35-0.8b-d-mix/merged, unsloth/Qwen3.5-0.8B@23c69c53 + LoRA + Clef 헤드, 구성 (d), 질문 세트 q-2026.10.14-mix, Unsloth 2026.10.5, PyTorch 16비트"
weights_sha256_16 = "94f8e23735f64400"

["q35-2b-ko"]
kind = "systemone"
url = "http://127.0.0.1:8889/v1/systemone"
model = "laya-local"
api_key_env = "UNSLOTH_API_KEY"
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
price_source = "로컬 서빙, 외부 과금 없음. 참고 비용은 docs/evaluation.md §2.6(jikgam/train/gpu_cost.py)"
served = "WSL2 ~/jikgam-train/runs/q35-2b-d-mix/merged, unsloth/Qwen3.5-2B@fffbc0d8 + LoRA + Clef 헤드, 구성 (d), 질문 세트 q-2026.10.14-mix, Unsloth 2026.10.5, PyTorch 16비트"
weights_sha256_16 = "3f9dcfe6df110822"

# 2B (d)의 서빙 방식 비교(docs/training.md §11). 가중치는 q35-2b-ko와 같고, Studio의 llama.cpp 경로로 GGUF를 서빙한다.
# 서빙 폴더 ~/jikgam-train/serve/q35-2b-d-mix-<양자화>는 jikgam/train/export_gguf.py가 만든다(병합 파일은 링크).
# serve.py --backend llama.cpp로 띄운다. 런타임 설정은 Studio 설치 전체에 걸리므로 한 번에 하나씩 잰다.
["q35-2b-ko-gguf-bf16"]
kind = "systemone"
url = "http://127.0.0.1:8890/v1/systemone"
model = "laya-local"
api_key_env = "UNSLOTH_API_KEY"
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
price_source = "로컬 서빙, 외부 과금 없음. 참고 비용은 docs/evaluation.md §2.6(jikgam/train/gpu_cost.py)"
served = "WSL2 ~/jikgam-train/serve/q35-2b-d-mix-bf16, q35-2b-d-mix 병합 모델의 GGUF BF16, Studio llama.cpp(unslothai/llama.cpp b11541)"
weights_sha256_16 = "3f9dcfe6df110822"

