[project]
name = "jikgam"
version = "0.1.0"
description = "한국어 실시간 상담을 위한 저지연 판별 시스템"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jikgam"]
