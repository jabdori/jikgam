[project]
name = "jikgam"
version = "0.1.0"
description = "한국어 실시간 상담을 위한 저지연 판별 시스템"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]
web = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
# 음성 런타임(ADR 0008). 엔진 코드는 이 그룹에 의존하지 않는다(jikgam/voice만 쓴다).
voice = ["pipecat-ai[google]==1.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jikgam"]

[tool.uv]
default-groups = ["dev", "web", "voice"]
