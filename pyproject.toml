[project]
name = "jikgam"
version = "0.1.0"
description = "한국어 실시간 상담을 위한 저지연 판별 시스템"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]
web = [
    "python-multipart>=0.0.20",
    "starlette>=0.40",
    "uvicorn>=0.30",
]
# 음성 런타임(ADR 0008). 엔진 코드는 이 그룹에 의존하지 않는다(jikgam/voice만 쓴다).
voice = ["pipecat-ai[google]==1.12.0"]
# 관리 콘솔 음성 시험의 브라우저 WebRTC 전송(Pipecat SmallWebRTC). Pipecat [webrtc]에서 오디오에 필요한 aiortc만 받는다
# (opencv는 영상 프레임에만 쓰여 뺀다).
voice-web = ["aiortc>=1.14.0,<2"]
ui = [
    "axe-playwright-python==0.1.8",
    "playwright==1.63.0",
]
# v2 문서 처리의 텍스트 추출(ADR 0023). 엔진의 상담 경로는 이 그룹에 의존하지 않는다.
ingest = [
    "pdfplumber==0.11.10",
    # v2 분할·예산의 토큰 수는 학습 때와 같은 Qwen3.5 토크나이저로 센다(docs/evaluation-v2.md §2.1)
    "tokenizers>=0.22,<0.24",
]
# v2 임베딩 검색(docs/evaluation-v2.md §3.4 보완). PyLate가 sentence-transformers 5.3.0을 고정한다.
# torch는 CUDA판을 PyTorch 저장소에서 받는다. 크기가 커서 기본 설치에서 뺀다: uv sync --group embed
embed = [
    "torch==2.11.0",
    "pylate==1.6.0",
    "sentence-transformers==5.3.0",
    "transformers==5.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jikgam"]

[tool.uv]
default-groups = ["dev", "web", "voice", "voice-web", "ui", "ingest"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
